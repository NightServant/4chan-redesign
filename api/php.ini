; Read by the vercel-php runtime (see the FAQ in juicyfx/vercel-php): it is
; applied on top of the runtime's own configuration and is not served.
;
; The runtime already sets post_max_size=6M and upload_max_filesize=6M, which
; is enough. This file pins upload_max_filesize to 5M and says post_max_size
; again, so the limits do not move if the runtime's defaults do.
;
; A reply image is capped at 4MB (`clover.attachments.max_kilobytes`) and the
; rest of the form is a few KB of text, so a request is at most a little over
; 4MB. Vercel itself refuses a body over about 4.5MB before PHP starts, which
; is why the composer also checks the size in the browser.
upload_max_filesize=5M
post_max_size=6M
