name: sync

# The backstop. An outside cron (cron-job.org) calls `POST /internal/sweep`
# every 30 minutes and runs the sweep on Vercel, beside the database. This
# runs it hourly from here in case that cron stops, because GitHub drops most
# scheduled slots (31 runs in a week where `*/30` asked for 336) and cannot be
# the only trigger. The odd minute is dropped less often than the top of the
# hour.
#
# The sweep keeps the cross-board pages (home, feed, search) current: they read
# the stored copy, and this is what refreshes it. Board and thread pages catch
# up on their own when opened (`CLOVER_LIVE_FETCH`).
#
# A sweep is one request for `boards.json` plus one per board, paced to the one
# a second 4chan asks for through the same cache table the site uses, so a
# sweep and a visitor opening a page share that rate and do not add to it.
#
# Needs one repository secret, `DB_URL`: the Neon connection string.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# A sweep that outlasts its interval is left to finish rather than raced by
# the next one, which would only queue behind it at the rate limit.
concurrency:
  group: clover-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DB_CONNECTION: pgsql
      DB_URL: ${{ secrets.DB_URL }}
      CACHE_STORE: database
      LOG_CHANNEL: stderr

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_pgsql

      - name: Find the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Sync from 4chan
        run: php artisan clover:sync --no-interaction
